name: Poetry application

on:
  push:
    branches: [ "ci" ]
  pull_request:
    branches: [ "ci" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
      - name: Install dependencies
        working-directory: src
        run: poetry install --with dev
      - name: Validate and build distribution
        working-directory: src
        run: |
          poetry check
          poetry build
      - name: Run a non-interactive example
        working-directory: src
        run: poetry run python fiveTimes.py
